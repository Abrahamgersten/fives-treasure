<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>אוצר החמישיות – משחק כפולות חמש</title>
<meta name="theme-color" content="#0b3d5c">
<style>
:root{--sea:#0b3d5c;--sea2:#1479a8;--gold:#ffc83d;--gold2:#e8a200;--ink:#102a3a;--ok:#2fbf71;--bad:#ef5b5b;--sand:#fff1c9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:"Rubik","Heebo","Segoe UI",Arial,sans-serif;color:var(--ink)}
body{background:linear-gradient(#58c4ee 0%,#1c86b5 45%,#0b3d5c 100%) fixed;overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible{outline:4px solid #fff;outline-offset:3px}
.waves{position:fixed;inset:auto 0 0 0;height:90px;background:
 radial-gradient(circle at 20px 0,transparent 22px,rgba(255,255,255,.16) 23px,rgba(255,255,255,.16) 30px,transparent 31px) 0 0/60px 40px repeat-x;pointer-events:none;animation:wv 6s linear infinite}
@keyframes wv{to{background-position:-60px 0}}
.cloud{position:fixed;top:6vh;font-size:64px;opacity:.85;animation:fl 38s linear infinite;pointer-events:none}
.cloud.c2{top:16vh;font-size:44px;animation-duration:55s;animation-delay:-20s}
@keyframes fl{from{right:-90px}to{right:110vw}}
.wrap{position:relative;max-width:880px;margin:0 auto;padding:14px 14px 90px}
header.top{display:flex;align-items:center;gap:10px;justify-content:space-between;color:#fff;margin-bottom:8px}
h1{margin:0;font-size:clamp(22px,5vw,34px);text-shadow:0 3px 0 rgba(0,0,0,.25)}
.chips{display:flex;gap:8px}
.chip{background:rgba(255,255,255,.22);border-radius:99px;padding:6px 14px;font-weight:700;color:#fff;backdrop-filter:blur(4px)}
.iconbtn{background:rgba(255,255,255,.25);color:#fff;width:44px;height:44px;border-radius:50%;font-size:22px}
.card{background:#fffdf4;border-radius:26px;padding:18px;box-shadow:0 10px 0 rgba(0,0,0,.18),0 20px 40px rgba(0,0,0,.2)}
.screen{display:none}.screen.on{display:block;animation:pop .35s ease}
@keyframes pop{from{transform:translateY(14px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.big{font-size:clamp(20px,4.6vw,28px);line-height:1.6}
.btn{background:linear-gradient(var(--gold),var(--gold2));border-radius:20px;padding:14px 26px;font-weight:800;font-size:22px;box-shadow:0 6px 0 #a56d00;transition:transform .08s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #a56d00}
.btn.sec{background:linear-gradient(#e9f6ff,#bfe3f7);box-shadow:0 6px 0 #6aa4c2;font-size:18px;padding:10px 18px}
.btn[disabled]{opacity:.45;pointer-events:none}
.hero{display:flex;gap:14px;align-items:center}
.parrot{font-size:84px;animation:bob 2.2s ease-in-out infinite;flex:none}
@keyframes bob{50%{transform:translateY(-10px) rotate(-5deg)}}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px;margin-top:14px}
.lv{position:relative;border-radius:20px;padding:12px 4px;text-align:center;font-weight:800;font-size:26px;background:linear-gradient(#fff,#ffe9a8);box-shadow:0 5px 0 #c99a2a}
.lv small{display:block;font-size:15px;letter-spacing:2px;min-height:20px}
.lv.lock{background:#cfd8dc;box-shadow:0 5px 0 #90a4ae;color:#78909c;pointer-events:none}
.lv.cur{animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.stage-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.target{font-size:clamp(34px,9vw,60px);font-weight:900;color:var(--gold2);text-shadow:0 3px 0 #0002}
.chestzone{position:relative;margin-top:10px;border-radius:22px;padding:12px;background:linear-gradient(#ffe7a0,#f5c86a);min-height:210px;border:4px dashed #b8821a}
.stack{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-content:flex-start;min-height:120px}
.cn{width:clamp(44px,10vw,64px);height:clamp(44px,10vw,64px);border-radius:50%;object-fit:cover;box-shadow:0 3px 0 #0006;animation:drop .35s cubic-bezier(.3,1.6,.5,1);background:#bbb}
@keyframes drop{from{transform:translateY(-70px) scale(1.5);opacity:0}to{transform:none;opacity:1}}
.cnwrap{position:relative;display:inline-block}
.cnwrap b{position:absolute;inset:auto 0 -4px 0;text-align:center;font-size:13px;color:#fff;background:#0b3d5ccc;border-radius:8px;margin:0 6px;line-height:16px}
.total{font-size:clamp(30px,7vw,46px);font-weight:900;text-align:center;margin:6px 0}
.row{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:10px}
.addcoin{width:112px;height:112px;border-radius:50%;padding:0;background:none;filter:drop-shadow(0 7px 0 #0005);transition:transform .1s}
.addcoin:active{transform:scale(.9) translateY(4px)}
.addcoin img{width:100%;height:100%;border-radius:50%;object-fit:cover;animation:shine 3s infinite}
@keyframes shine{50%{filter:brightness(1.25) saturate(1.2)}}
.plus{font-size:20px;font-weight:800;color:#0b3d5c}
.msg{min-height:30px;text-align:center;font-weight:700;font-size:20px;margin-top:8px}
.eq{direction:ltr;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;font-size:clamp(34px,10vw,64px);font-weight:900;margin:16px 0;unicode-bidi:isolate}
.box{display:inline-flex;min-width:1.5em;height:1.3em;align-items:center;justify-content:center;border-radius:16px;background:#fff;border:5px dashed var(--sea2);color:var(--sea2);padding:0 .25em}
.box.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:340px;margin:0 auto}
.pad button{background:linear-gradient(#fff,#d9efff);border-radius:18px;font-size:30px;font-weight:800;padding:12px 0;box-shadow:0 5px 0 #7bb4d2}
.pad button:active{transform:translateY(4px);box-shadow:0 1px 0 #7bb4d2}
.pad .go{background:linear-gradient(#7ff0ae,var(--ok));box-shadow:0 5px 0 #17844b;color:#fff}
.prog{display:flex;gap:6px;justify-content:center;margin:6px 0}
.dot{width:16px;height:16px;border-radius:50%;background:#d6d6d6}.dot.d{background:var(--ok)}.dot.c{background:var(--gold);transform:scale(1.3)}
.hint{background:#e8f6ff;border-radius:16px;padding:10px 14px;margin-top:12px;font-size:19px;display:none}
.hint.on{display:block}
.stars{font-size:54px;text-align:center;letter-spacing:6px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-30px;font-style:normal;font-size:30px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.chest{font-size:90px;text-align:center;transition:transform .3s}
.chest.open{animation:wob .8s}
@keyframes wob{30%{transform:scale(1.3) rotate(-8deg)}60%{transform:scale(1.2) rotate(8deg)}}
.treasure{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;font-size:34px}
.strip{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px;direction:ltr}
.strip span{background:#fff;border-radius:12px;padding:4px 10px;font-weight:800;font-size:18px;box-shadow:0 2px 0 #0003}
.strip span.now{background:var(--gold)}
.story{font-size:clamp(18px,4.2vw,24px);text-align:center;background:#fff6d6;border-radius:16px;padding:10px 14px;margin-top:8px;line-height:1.5}
.demo-bar{background:#e1f5e9;border-radius:16px;padding:10px 14px;margin-top:8px;font-weight:700;text-align:center;font-size:20px}
.legend{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-weight:800;font-size:15px}
.rv{color:#c98a00}.rc{color:#1479a8}.rt{color:#1f9e5a}
.box.rv{border-color:#c98a00;color:#c98a00}.box.rc{border-color:#1479a8;color:#1479a8}.box.rt{border-color:#1f9e5a;color:#1f9e5a}
.aid{display:none;background:linear-gradient(#ffe7a0,#f5c86a);border:4px dashed #b8821a;border-radius:20px;padding:10px;margin-top:10px}
.aid.on{display:block}
.cnwrap.off .cn{filter:grayscale(1);opacity:.3}
.cnwrap.off{cursor:pointer}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:420px;margin:14px auto}
.opts button{background:linear-gradient(#fff,#d9efff);border-radius:20px;font-size:36px;font-weight:900;padding:16px 0;box-shadow:0 6px 0 #7bb4d2}
.opts button.good{background:linear-gradient(#7ff0ae,var(--ok));color:#fff;box-shadow:0 6px 0 #17844b}
.opts button.nope{background:#ffd9d9;box-shadow:0 6px 0 #d49a9a}
.dq{font-size:clamp(34px,10vw,60px);font-weight:900;text-align:center;direction:ltr;margin:12px 0}
.joke-img{display:block;max-width:100%;max-height:46vh;margin:8px auto;border-radius:20px;box-shadow:0 6px 0 rgba(0,0,0,.2)}
audio{width:100%;margin-top:8px}
.jlist{display:grid;gap:10px;margin-top:10px}
.jlist button{background:linear-gradient(#fff,#ffe9a8);border-radius:16px;padding:12px;font-weight:800;font-size:18px;box-shadow:0 4px 0 #c99a2a;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.readbtn{position:fixed;bottom:16px;left:16px;z-index:50;background:#ffd23f;color:#3a2a00;border-radius:999px;padding:14px 20px;font-size:20px;font-weight:800;box-shadow:0 5px 0 #c99a2a,0 8px 18px rgba(0,0,0,.3);display:flex;gap:8px;align-items:center}.readbtn:active{transform:translateY(3px)}
</style>
</head>
<body>
<button class="readbtn" id="readbtn" aria-label="הקראת המסך">🔊 הקרא לי</button>
<div class="cloud">☁️</div><div class="cloud c2">☁️</div><div class="waves"></div>
<div class="wrap">
<header class="top">
 <h1>🏴‍☠️ אוצר החמישיות</h1>
 <div class="chips"><div class="chip" id="gems">💎 0</div><button class="iconbtn" id="mute" aria-label="צלילים">🔊</button></div>
</header>

<!-- פתיחה / סיפור -->
<section class="screen on card" id="s-story">
 <div class="hero"><div class="parrot">🦜</div><div class="big" id="story-text"></div></div>
 <div class="row"><button class="btn" id="story-next">יאללה, מתחילים! ⚓</button></div>
</section>

<!-- אבחון -->
<section class="screen card" id="s-diag">
 <div class="stage-head"><div class="big">🧭 כמה שאלות קטנות להכיר אתכם</div></div>
 <div class="prog" id="d-prog"></div>
 <div class="big" id="d-text" style="text-align:center"></div>
 <div class="stack" id="d-coins" style="margin-top:8px;min-height:0"></div>
 <div class="dq" id="d-q"></div>
 <div class="opts" id="d-opts"></div>
 <div class="row"><button class="btn sec" id="d-skip">לא יודע/ת, ממשיכים 🙂</button></div>
 <div class="msg" id="d-msg"></div>
</section>
<section class="screen card" id="s-diagres">
 <div class="hero"><div class="parrot">🦜</div><div class="big" id="dr-text"></div></div>
 <div class="row"><button class="btn" id="dr-go">יוצאים להפלגה! ⛵</button></div>
</section>

<!-- בדיחה (פרס) -->
<section class="screen card" id="s-joke">
 <div class="big" style="text-align:center">🎭 <b>פרס: בדיחה!</b></div>
 <img class="joke-img" id="j-img" alt="">
 <div class="big" id="j-title" style="text-align:center;font-weight:800"></div>
 <audio id="j-audio" controls preload="none"></audio>
 <div class="row"><button class="btn" id="j-back">המשך ➡️</button></div>
</section>
<section class="screen card" id="s-jokes">
 <div class="stage-head"><div class="big"><b>🎭 הבדיחות שלי</b></div><button class="btn sec" id="jl-back">🗺️ מפה</button></div>
 <div class="jlist" id="jlist"></div>
</section>

<!-- מפה -->
<section class="screen card" id="s-map">
 <div class="stage-head"><div class="big"><b>מפת האוצרות</b> – בחר/י תיבה</div><div class="row" style="margin:0"><button class="btn sec" id="re-story">📜 הסיפור</button><button class="btn sec" id="re-diag">🧭 אבחון מחדש</button><button class="btn sec" id="open-jokes">🎭 בדיחות</button></div></div>
 <div class="strip" id="strip"></div>
 <div class="map" id="map"></div>
</section>

<!-- בנייה -->
<section class="screen card" id="s-build">
 <div class="stage-head"><button class="btn sec" id="b-back">🗺️ מפה</button><div class="big">צריך בדיוק: <span class="target" id="b-target">10</span></div></div>
 <div class="big" id="b-help" style="text-align:center">כל מטבע שווה 5 ₪. לחצו על המטבע כדי להוסיף.</div>
 <div class="chestzone"><div class="stack" id="stack"></div></div>
 <div class="total"><span id="b-total">0</span> ₪</div>
 <div class="strip" id="b-strip"></div>
 <div class="row">
  <button class="addcoin" id="add" aria-label="הוסף מטבע של 5"><img src="assets/coin5.jpg" alt="מטבע של חמישה שקלים"></button>
  <div class="plus">+5</div>
  <button class="btn sec" id="undo">↩️ הורד מטבע</button>
  <button class="btn sec" id="clear">🧹 מחק הכול</button>
 </div>
 <div class="msg" id="b-msg"></div>
</section>

<!-- תרגילים -->
<section class="screen card" id="s-quiz">
 <div class="stage-head"><div class="big">🔑 המנעול של <b id="q-n">10</b> ₪</div><div class="row" style="margin:0"><button class="btn sec" id="q-show">👀 הראו לי</button><button class="btn sec" id="q-hint">💡 רמז</button></div></div>
 <div class="prog" id="prog"></div>
 <div class="demo-bar" id="demo-bar" style="display:none">👀 קודם אני מראה איך עושים. הסתכלו ושימו לב לכל מטבע.</div>
 <div class="story" id="q-story"></div>
 <div class="eq" id="eq"></div>
 <div class="legend"><span class="rv">🪙 שווי מטבע</span><span class="rc">🔢 כמה מטבעות</span><span class="rt">💰 סך הכל</span></div>
 <div class="aid" id="aid"></div>
 <div class="strip" id="q-strip"></div>
 <div class="hint" id="hint"></div>
 <div class="row"><button class="btn" id="demo-go" style="display:none">עכשיו אני מנסה! ✋</button></div>
 <div class="pad" id="pad"></div>
 <div class="msg" id="q-msg"></div>
</section>

<!-- ניצחון שלב -->
<section class="screen card" id="s-win">
 <div class="chest" id="chest">🧰</div>
 <div class="stars" id="stars"></div>
 <div class="big" id="win-text" style="text-align:center"></div>
 <div class="treasure" id="treasure"></div>
 <div class="row"><button class="btn" id="win-next">לתיבה הבאה ➡️</button><button class="btn sec" id="win-map">🗺️ למפה</button></div>
 <div class="row"><button class="btn" id="win-joke" style="display:none">🎁 קבלו בדיחה!</button></div>
</section>
</div>
<div class="confetti" id="confetti"></div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const LEVELS=Array.from({length:19},(_,i)=>10+5*i);
const KEY="fives-treasure-v1";
let save={done:{},gems:0,seen:{},demo:{},diag:0,skill:1,start:0,jokes:0,jr:{},recent:[]};
try{Object.assign(save,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}};

/* ---------- צלילים (נוצרים בדפדפן, בלי קבצים חיצוניים) ---------- */
let ac=null,muted=false;
function ctx(){if(!ac){const A=window.AudioContext||window.webkitAudioContext;if(A)ac=new A()}if(ac&&ac.state==="suspended")ac.resume();return ac}
function tone(f,t0,d,type,vol){const a=ctx();if(!a||muted)return;const o=a.createOscillator(),g=a.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(vol||.2,a.currentTime+t0);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t0+d);o.connect(g);g.connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+d+.02)}
const sfx={
 coin(n){const b=1500+(n%8)*90;tone(b,0,.09,"square",.08);tone(b*1.5,.06,.25,"triangle",.14)},
 undo(){tone(500,0,.1,"triangle",.15);tone(350,.08,.12,"triangle",.15)},
 ok(){[523,659,784].forEach((f,i)=>tone(f,i*.09,.25,"triangle",.2))},
 bad(){tone(180,0,.2,"sawtooth",.15);tone(140,.12,.28,"sawtooth",.13)},
 chest(){[392,494,587,784,988,1175].forEach((f,i)=>tone(f,i*.11,.4,"triangle",.2));for(let i=0;i<8;i++)tone(2400+i*140,.7+i*.05,.12,"square",.05)},
 splash(){const a=ctx();if(!a||muted)return;const len=a.sampleRate*.5,buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);const s=a.createBufferSource(),g=a.createGain(),fl=a.createBiquadFilter();fl.type="lowpass";fl.frequency.value=900;g.gain.value=.12;s.buffer=buf;s.connect(fl);fl.connect(g);g.connect(a.destination);s.start()},
 key(){tone(900,0,.05,"square",.06)}
};
let aud=null,aq=[];
function stopSay(){aq=[];if(aud){aud.onended=null;aud.onerror=null;aud.pause();aud=null}}
function nextClip(){const k=aq.shift();if(!k){aud=null;return}aud=new Audio("audio/"+k+".mp3");aud.onended=()=>setTimeout(nextClip,150);aud.onerror=nextClip;aud.play().catch(()=>{})}
function playKeys(keys){stopSay();aq=keys.filter(Boolean);nextClip()}
function say(t){if(muted)return;const n=+t;if(String(n)===String(t)&&n>=0&&n<=100)playKeys(["n"+n])}
function eqKeys(s){const k=[];String(s).split(/(\d+|×|÷|=|\?|□)/).forEach(p=>{if(!p)return;if(/^\d+$/.test(p)){if(+p<=100)k.push("n"+p)}else if(p==="×")k.push("kefel");else if(p==="÷")k.push("chelki");else if(p==="=")k.push("shave");else if(p==="?"||p==="□")k.push("kama")});return k}
function readScreen(){
 if(aud){stopSay();return}
 const sc=document.querySelector(".screen.on");if(!sc)return;const id=sc.id;let k=[];
 if(id==="s-story")k=[storyIdx==="win"?"storywin":"story"+storyIdx];
 else if(id==="s-diag"){const q=dq[di];k=[q.coins?"diag_count":q.seq?"diag_seq":q.text==="כמה זה?"?"diag_how":"diag_miss"].concat(eqKeys(q.seq?q.seq.join(" , "):(q.eq||"")));k.push("opts");$("d-opts").querySelectorAll("button").forEach(b=>{if(+b.textContent<=100)k.push("n"+b.textContent)})}
 else if(id==="s-diagres")k=["dr"+save.skill];
 else if(id==="s-map")k=["map"];
 else if(id==="s-build")k=[(li===0?"b0_":"b_")+N];
 else if(id==="s-quiz"){const q=qs[qi];k=[(q.kind==="count"?"c":q.kind==="total"?"t":"v")+N].concat(eqKeys(q.p.map(x=>Array.isArray(x)?x[0]:x).join(" ")))}
 else if(id==="s-win")k=["w_"+N];
 else if(id==="s-joke")k=["joke"];
 playKeys(k);
}
$("readbtn").onclick=readScreen;
$("mute").onclick=()=>{muted=!muted;$("mute").textContent=muted?"🔇":"🔊";if(!muted){ctx();sfx.key()}};

/* ---------- ניווט ---------- */
function show(id){stopSay();document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));$(id).classList.add("on");window.scrollTo({top:0,behavior:"smooth"})}
function confetti(n){const c=$("confetti"),em=["⭐","🪙","💎","🎉","✨","🦜"];for(let i=0;i<(n||40);i++){const e=document.createElement("i");e.textContent=em[i%em.length];e.style.right=Math.random()*100+"vw";e.style.animationDuration=2+Math.random()*2.5+"s";e.style.animationDelay=Math.random()*.6+"s";c.appendChild(e);setTimeout(()=>e.remove(),5200)}}
function updGems(){$("gems").textContent="💎 "+save.gems}

/* ---------- סיפור ---------- */
const STORY=[
"ברוכים הבאים, מלחים! אני התוכי <b>חמוש</b>, הסייר של קפטן חמישי. הקפטן הסתיר אוצר ענק בתיבות קסומות על האיים. אבל כל תיבה ננעלה בקסם: <b>היא נפתחת רק ממטבעות של 5 ₪</b>, ורק בסכום המדויק! מי שמצליח לפתוח אותן, מתרגל ומתחזק בכפולות של 5, ומקבל <b>יהלומים</b>. מוכנים להפוך לקפטנים?",

let qs=[],qi=0,typed="",mistakes=0,qm=0,demoMode=false,aidTimer=null,aidApi=null;
const phase=()=>save.skill===0?(li<8?1:(li<15?2:3)):(save.skill===1?(li<6?1:(li<12?2:3)):(li<4?2:3));
const v=()=>["5","v"],c=k=>[k,"c"],t=n=>[n,"t"],bx=r=>["□",r];
function makeQs(n){
 const k=n/5;
 const mk=(p,kind,a,h)=>({p,kind,a,h});
 const hc="ספרו מטבעות של 5 עד שמגיעים ל-"+n+": 5, 10, 15... כמה מטבעות יצאו?";
 const ht="הדליקו כל מטבע וספרו בקפיצות של 5, "+k+" פעמים.";
 const hv="נסו מספר. כל מטבע בשווי המספר, ובדקו אם הסך הכל יוצא "+n+".";
 const all=[
  mk([v(),"×",bx("c"),"=",t(n)],"count",k,hc),
  mk([bx("c"),"×",v(),"=",t(n)],"count",k,hc),
  mk([t(n),"÷",v(),"=",bx("c")],"count",k,hc),
  mk([t(n),"÷",bx("c"),"=",v()],"count",k,hc),
  mk([v(),"×",c(k),"=",bx("t")],"total",n,ht),
  mk([c(k),"×",v(),"=",bx("t")],"total",n,ht),
  mk([bx("t"),"÷",v(),"=",c(k)],"total",n,ht),
  mk([bx("v"),"×",c(k),"=",t(n)],"value",5,hv),
  mk([t(n),"÷",c(k),"=",bx("v")],"value",5,hv)
 ];
 const ph=phase();
 let pool=ph===1?[0,2,4,5]:(ph===2?[0,1,2,3,4,5,6,7]:[0,1,2,3,4,5,6,7,8]);
 pool=pool.sort(()=>Math.random()-.5);
 const pick=pool.slice(0,4);
 if(ph===1)pick.sort((a,b)=>(all[a].kind==="total"?1:0)-(all[b].kind==="total"?1:0));
 return pick.map(i=>all[i]);
}
function storyOf(q,n){const k=n/5;
 return q.kind==="count"?"יש לי מטבעות של 5 ₪. ביחד יש לי "+n+" ₪. כמה מטבעות יש לי?":
  q.kind==="total"?"יש לי "+k+" מטבעות של 5 ₪. כמה כסף יש לי ביחד?":
  "יש לי "+k+" מטבעות זהים. ביחד יש לי "+n+" ₪. כמה שווה כל מטבע?"}

  return true};

function finish(){
 const st=mistakes===0?3:(mistakes<=2?2:1);
 const gain=st+(save.done[N]?0:2);
 save.done[N]=Math.max(save.done[N]||0,st);save.gems+=gain;persist();updGems();

const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function diagQs(){
 const q=[],f=(t,a,text,extra)=>q.push(Object.assign({t,a,text},extra));

 let s=rnd(1,4)*5;f(2,s+10,"השלימו את הספירה בקפיצות של 5",{seq:[s,s+5,"?",s+15]});
 s=rnd(6,10)*5;f(2,s+10,"השלימו את הספירה בקפיצות של 5",{seq:[s,s+5,"?",s+15]});
 k=rnd(3,6);f(3,k*5,"כמה זה?",{eq:k+" × 5 = ?"});
 k=rnd(7,10);f(3,k*5,"כמה זה?",{eq:k+" × 5 = ?"});
 k=rnd(4,8);f(4,k,"כמה זה?",{eq:k*5+" ÷ 5 = ?"});
 k=rnd(6,10);f(4,k,"איזה מספר חסר?",{eq:"5 × ? = "+k*5});
 k=rnd(9,16);f(5,k,"איזה מספר חסר?",{eq:"? × 5 = "+k*5});
 k=rnd(12,19);f(5,k,"כמה זה?",{eq:k*5+" ÷ 5 = ?"});
 return q}

 let n=1;while(o.size<4){o.add(q.a+n*st+n);n++}
 const arr=[...o].sort(()=>Math.random()-.5),box=$("d-opts");box.innerHTML="";
 arr.forEach(x=>{const b=document.createElement("button");b.textContent=x;b.onclick=()=>diagPick(b,x===q.a);box.appendChild(b)})}
function diagPick(b,ok){
 if(dlock)return;dlock=true;sfx.key();
 if(ok){b.classList.add("good");dcorrect++;dwrongRow=0;sfx.ok();$("d-msg").textContent="👍 יפה!"}
 else{b.classList.add("nope");dwrongRow++;$("d-msg").textContent="🙂 בסדר גמור, ממשיכים."}
 setTimeout(diagNext,900)}
$("d-skip").onclick=()=>{if(dlock)return;dlock=true;dwrongRow++;$("d-msg").textContent="🙂 בסדר גמור, ממשיכים.";setTimeout(diagNext,700)};
function diagNext(){di++;if(dwrongRow>=2||di>=dq.length)diagEnd();else diagShow()}
function diagEnd(){
 const c=dcorrect;let sk=c<=3?0:(c<=7?1:2);
 save.skill=sk;save.start=[0,3,6][sk];save.diag=1;save.recent=[];persist();
 const msg=[
  "סיימנו! נתחיל בקצב נוח: המון מטבעות לעזרה, והסבר צעד אחרי צעד. אין מרוץ, כל תיבה בזמן שלך. 🪙",
  "יפה מאוד! אתם כבר מכירים חלק מהחמישיות. אפתח לכם את התיבות מ-"+LEVELS[3]+" ₪, ועדיין אעזור עם מטבעות כשצריך. 👍",
  "וואו, אתם חזקים! אפתח לכם את התיבות מ-"+LEVELS[6]+" ₪, עם פחות עזרה ויותר חידות. אם יהיה קשה, אחזור לעזור. 🚀"][sk];
 $("dr-text").textContent=msg;$("dr-go").onclick=goMap;show("s-diagres")}
updGems();showStory(0,save.diag?goMap:goDiag);
if(Object.keys(save.done).length){$("story-next").textContent="להמשך ההפלגה ⛵"}
save.seen.intro=1;persist();
})();
</script>
